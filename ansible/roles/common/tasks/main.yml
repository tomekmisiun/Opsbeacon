- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install system packages
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      - nginx
      - python3-pip
    state: present

- name: Install Docker
  ansible.builtin.apt:
    name:
      - docker.io
      - docker-compose-v2
    state: present

- name: Enable Docker
  ansible.builtin.service:
    name: docker
    enabled: true
    state: started

- name: Create application directory
  ansible.builtin.file:
    path: "{{ opsbeacon_app_dir }}"
    state: directory
    owner: ubuntu
    group: ubuntu
    mode: "0755"

- name: Copy application files
  ansible.posix.synchronize:
    src: "{{ playbook_dir }}/../"
    dest: "{{ opsbeacon_app_dir }}/"
    delete: true
    rsync_opts:
      - "--filter=':- .gitignore'"
      - "--exclude=.git"
  notify: restart opsbeacon

- name: Install Nginx site
  ansible.builtin.template:
    src: opsbeacon.conf.j2
    dest: /etc/nginx/sites-available/opsbeacon
    mode: "0644"
  notify: reload nginx

- name: Enable Nginx site
  ansible.builtin.file:
    src: /etc/nginx/sites-available/opsbeacon
    dest: /etc/nginx/sites-enabled/opsbeacon
    state: link
  notify: reload nginx

- name: Disable default Nginx site
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: reload nginx

- name: Enable Nginx
  ansible.builtin.service:
    name: nginx
    enabled: true
    state: started

- name: Start OpsBeacon
  community.docker.docker_compose_v2:
    project_src: "{{ opsbeacon_app_dir }}"
    files:
      - compose.yaml
      - compose.prod.yaml
    build: always
    state: present
