services:
  db:
    image: postgres:16

    environment:
      POSTGRES_DB: opsbeacon
      POSTGRES_USER: opsbeacon
      POSTGRES_PASSWORD: opsbeacon

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opsbeacon -d opsbeacon"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .

    env_file:
      - path: .env
        required: false

    ports:
      - "8000:8000"

    depends_on:
      db:
        condition: service_healthy

    command: >
      sh -c "alembic upgrade head &&
      python -m app.seed &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000"

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
        ]
      interval: 30s
      timeout: 5s
      retries: 3

  worker:
    build: .

    env_file:
      - path: .env
        required: false

    depends_on:
      db:
        condition: service_healthy
      web:
        condition: service_healthy

    command: python -m app.worker

volumes:
  postgres_data:
