[project]
name = "opsbeacon"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
  "alembic>=1.13",
  "fastapi>=0.115,<0.116",
  "httpx>=0.27,<0.28",
  "jinja2>=3.1",
  "psycopg[binary]>=3.2",
  "pydantic-settings>=2.6",
  "python-multipart>=0.0.18",
  "sqlalchemy>=2.0",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
  "ansible-core>=2.17",
  "pytest>=8.3",
  "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
